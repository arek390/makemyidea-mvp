<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>makemyideawork</title>
  </head>
  <body>
    <div
      id="boot-overlay"
      style="
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 2147483647;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 10px 12px;
        border-radius: 8px;
        font: 12px/1.3 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial;
        max-width: 360px;
        white-space: pre-wrap;
      "
    >
      BOOT: html loaded
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-overlay')
        var update = function (line) {
          if (!el) return
          el.textContent += '\n' + line
        }
        if (location.hostname === 'localhost') {
          update('href: ' + location.href)
          update('ua: ' + navigator.userAgent)
          update('ts: ' + new Date().toISOString())
          window.__BOOT_OVERLAY__ = true
          window.addEventListener('error', function (e) {
            update('ERROR: ' + (e && e.message ? e.message : 'unknown'))
          })
          window.addEventListener('unhandledrejection', function (e) {
            var reason = e && e.reason ? e.reason : 'unknown'
            update(
              'PROMISE: ' +
                (reason && reason.message ? reason.message : String(reason))
            )
          })
        } else if (el) {
          el.style.display = 'none'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
